name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Rebuild the page bundles from data/db/, so a pushed table edit
      # deploys even if scripts/compile.py wasn't run locally
      - run: python3 scripts/compile.py

      # ?v=<file hash> on index.html's local CSS/JS, so browsers don't pair
      # a new page with a cached old script or stylesheet after a deploy
      - run: python3 scripts/stamp_versions.py

      # scripts/build_pages.py checks which images exist in the assets repo. A blobless
      # clone with a near-empty sparse checkout gives it the file listing
      # without downloading the images themselves.
      - uses: actions/checkout@v4
        with:
          repository: thailehuy/mecharashi-wiki-assets
          path: .assets
          filter: blob:none
          sparse-checkout: README.md
          sparse-checkout-cone-mode: false

      # Per-item copies of index.html with their own link-preview tags
      - run: python3 scripts/build_pages.py && rm -rf .assets
        env:
          ASSETS_DIR: .assets

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4
